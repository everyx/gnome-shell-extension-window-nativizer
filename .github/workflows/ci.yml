name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: CI Image
    # Built here rather than in its own workflow, because a pull request that changes the Dockerfile
    # has to run its jobs in the image it just built; `needs` is the only ordering Actions offers.
    uses: ./.github/workflows/ci-image.yml
    if: ${{ !startsWith(github.head_ref, 'release-please') }}

  lint:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    needs: image
    container:
      # The system dependencies live here, not in an apt step: installing gnome-shell took 84s, 72s
      # and 723s on three consecutive runs, and the variance was the network. ci-image.yml builds it.
      image: ${{ needs.image.outputs.ref }}
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The slop rules compare a file's text with HEAD~5, so the history has to be there;
          # without it they fall back to whole-file inspection and report the legacy prose.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check upstream code generation consistency
        run: |
          pnpm run check:style
          git diff --exit-code

  ego-lint:
    name: EGO Reviewer Compliance
    runs-on: ubuntu-latest
    needs: image
    container:
      # The system dependencies live here, not in an apt step: installing gnome-shell took 84s, 72s
      # and 723s on three consecutive runs, and the variance was the network. ci-image.yml builds it.
      image: ${{ needs.image.outputs.ref }}
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The pin, the upstream patch and the baseline comparison all live in tools/ego-lint.sh, so
      # this job and a contributor's pre-commit cannot disagree about which tool ran, or about what
      # it saw - the two Object.freeze() warnings that reached master were printed here and the job
      # stayed green, because a warning is not a failure.
      - name: Read the ego-lint pin
        id: ego
        run: echo "ref=$(cat tools/ego-lint.version)" >> "$GITHUB_OUTPUT"

      - name: Checkout gnome-extension-reviewer
        uses: actions/checkout@v7
        with:
          repository: ZviBaratz/gnome-extension-reviewer
          # The tool's `main` has broken this job twice - an unbound variable on the
          # "may pass with comments" path, and a grep that fails the step under `set -e`.
          # Bump tools/ego-lint.version deliberately and re-read the verdict logic when you do.
          ref: ${{ steps.ego.outputs.ref }}
          path: .ego-lint

      - name: Run ego-lint compliance checks
        run: EGO_LINT_DIR=.ego-lint bash tools/ego-lint.sh

  test:
    name: Unit Tests (GJS + Jasmine)
    runs-on: ubuntu-latest
    needs: image
    container:
      # The system dependencies live here, not in an apt step: installing gnome-shell took 84s, 72s
      # and 723s on three consecutive runs, and the variance was the network. ci-image.yml builds it.
      image: ${{ needs.image.outputs.ref }}
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Run Jasmine unit tests
        run: pnpm test

      - name: Run tool tests
        run: pnpm run test:tools

  pack:
    name: Extension Package Build
    runs-on: ubuntu-latest
    needs: image
    container:
      # The system dependencies live here, not in an apt step: installing gnome-shell took 84s, 72s
      # and 723s on three consecutive runs, and the variance was the network. ci-image.yml builds it.
      image: ${{ needs.image.outputs.ref }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Pack extension
        run: pnpm run build

      - name: Verify package with Shexli (EGO analyzer)
        run: pnpm run lint:zip

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: window-nativizer-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Provide extension package in PR comment and summary
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');

            const distDir = 'dist';
            const files = fs.readdirSync(distDir).filter(f => f.endsWith('.zip'));
            if (files.length === 0) {
              core.setFailed('No zip package found in dist/');
              return;
            }

            const fileName = files[0];
            const filePath = path.join(distDir, fileName);
            const fileStats = fs.statSync(filePath);
            const fileSizeKB = (fileStats.size / 1024).toFixed(1);

            const fileBuffer = fs.readFileSync(filePath);
            const sha256 = crypto.createHash('sha256').update(fileBuffer).digest('hex');

            const runId = context.runId;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const commitSha = context.sha.substring(0, 7);

            const directDownloadUrl = `https://nightly.link/${repoOwner}/${repoName}/actions/runs/${runId}/window-nativizer-extension.zip`;
            const artifactPageUrl = `https://github.com/${repoOwner}/${repoName}/actions/runs/${runId}#artifacts`;

            const commentTag = '<!-- window-nativizer-pr-package -->';
            const body = [
              commentTag,
              `### 📦 Test Extension Build Available`,
              ``,
              `A test package has been automatically built from commit \`${commitSha}\`:`,
              ``,
              `| Package | Size | SHA256 Checksum |`,
              `| :--- | :--- | :--- |`,
              `| **\`${fileName}\`** | ${fileSizeKB} KiB | \`${sha256.substring(0, 16)}...\` |`,
              ``,
              `#### 📥 Direct Download`,
              `- **[Download Extension ZIP (Direct / No Login Required)](${directDownloadUrl})**`,
              `- [View on GitHub Actions Artifacts](${artifactPageUrl})`,
              ``,
              `#### 🚀 How to Install & Test`,
              `\`\`\`bash`,
              `# 1. Install via terminal:`,
              `gnome-extensions install --force ${fileName}`,
              ``,
              `# 2. Restart GNOME Shell:`,
              `#    - X11: Alt + F2, type 'r', and press Enter`,
              `#    - Wayland: Log out and log back in`,
              `\`\`\``,
              `*(This comment will be automatically updated on new commits to this PR.)*`
            ].join('\n');

            await core.summary.addRaw(body).write();

            if (context.eventName === 'pull_request') {
              const issue_number = context.payload.pull_request.number;
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: repoOwner,
                  repo: repoName,
                  issue_number,
                });

                const existingComment = comments.find(c => c.body && c.body.includes(commentTag));

                if (existingComment) {
                  await github.rest.issues.updateComment({
                    owner: repoOwner,
                    repo: repoName,
                    comment_id: existingComment.id,
                    body,
                  });
                  core.info(`Updated existing package comment on PR #${issue_number}`);
                } else {
                  await github.rest.issues.createComment({
                    owner: repoOwner,
                    repo: repoName,
                    issue_number,
                    body,
                  });
                  core.info(`Created new package comment on PR #${issue_number}`);
                }
              } catch (error) {
                core.warning(`Could not post/update PR comment (likely a fork without write permissions): ${error.message}`);
              }
            }
