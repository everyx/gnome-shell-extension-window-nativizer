name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Code Quality & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check upstream code generation consistency
        run: |
          pnpm run check-style
          git diff --exit-code

  ego-lint:
    name: EGO Reviewer Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout gnome-extension-reviewer
        uses: actions/checkout@v7
        with:
          repository: ZviBaratz/gnome-extension-reviewer
          # Pinned: the tool's `main` has broken this job twice - an unbound
          # variable on the "may pass with comments" path (any single warning
          # aborted the job) and, before that, a grep that fails the step under
          # `set -e`. Bump deliberately and re-read the verdict logic when you do.
          ref: v0.1.31
          path: .ego-lint

      - name: Install GLib schema compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev-bin

      - name: Run ego-lint compliance checks
        run: |
          # Upstream bug in the pinned release: under `set -eo pipefail` the
          # verdict's `grep "^WARN|"` exits 1 when an extension has no warnings at
          # all, which fails the step before the verdict is printed. Tolerate the
          # empty result while keeping the count fed by the pipeline.
          sed -i -e 's/grep "\^WARN|" "\$RESULTS_FILE" | cut/grep "\^WARN|" "\$RESULTS_FILE" 2>\/dev\/null | cut/' \
                 -e 's/| sort -u | wc -l)/| sort -u | wc -l || true)/' \
                 .ego-lint/skills/ego-lint/scripts/ego-lint.sh
          bash .ego-lint/ego-lint --show all src/

  test:
    name: Unit Tests (GJS + Jasmine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-dev-bin gettext meson ninja-build gir1.2-graphene-1.0

      - name: Install jasmine-gjs
        run: |
          git clone --depth 1 https://github.com/ptomato/jasmine-gjs.git /tmp/jasmine-gjs
          meson setup /tmp/jasmine-gjs/build /tmp/jasmine-gjs --prefix=/usr
          sudo ninja -C /tmp/jasmine-gjs/build install

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jasmine unit tests
        run: pnpm test

  pack:
    name: Extension Package Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell gettext libglib2.0-dev-bin

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack extension
        run: pnpm run pack

      - name: Verify package with Shexli (EGO analyzer)
        run: pnpm run shexli

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: window-nativizer-extension
          path: dist/*.zip
          if-no-files-found: error

      - name: Provide extension package in PR comment and summary
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');

            const distDir = 'dist';
            const files = fs.readdirSync(distDir).filter(f => f.endsWith('.zip'));
            if (files.length === 0) {
              core.setFailed('No zip package found in dist/');
              return;
            }

            const fileName = files[0];
            const filePath = path.join(distDir, fileName);
            const fileStats = fs.statSync(filePath);
            const fileSizeKB = (fileStats.size / 1024).toFixed(1);

            const fileBuffer = fs.readFileSync(filePath);
            const sha256 = crypto.createHash('sha256').update(fileBuffer).digest('hex');

            const runId = context.runId;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const commitSha = context.sha.substring(0, 7);

            const directDownloadUrl = `https://nightly.link/${repoOwner}/${repoName}/actions/runs/${runId}/window-nativizer-extension.zip`;
            const artifactPageUrl = `https://github.com/${repoOwner}/${repoName}/actions/runs/${runId}#artifacts`;

            const commentTag = '<!-- window-nativizer-pr-package -->';
            const body = [
              commentTag,
              `### 📦 Test Extension Build Available`,
              ``,
              `A test package has been automatically built from commit \`${commitSha}\`:`,
              ``,
              `| Package | Size | SHA256 Checksum |`,
              `| :--- | :--- | :--- |`,
              `| **\`${fileName}\`** | ${fileSizeKB} KiB | \`${sha256.substring(0, 16)}...\` |`,
              ``,
              `#### 📥 Direct Download`,
              `- **[Download Extension ZIP (Direct / No Login Required)](${directDownloadUrl})**`,
              `- [View on GitHub Actions Artifacts](${artifactPageUrl})`,
              ``,
              `#### 🚀 How to Install & Test`,
              `\`\`\`bash`,
              `# 1. Install via terminal:`,
              `gnome-extensions install --force ${fileName}`,
              ``,
              `# 2. Restart GNOME Shell:`,
              `#    - X11: Alt + F2, type 'r', and press Enter`,
              `#    - Wayland: Log out and log back in`,
              `\`\`\``,
              `*(This comment will be automatically updated on new commits to this PR.)*`
            ].join('\n');

            await core.summary.addRaw(body).write();

            if (context.eventName === 'pull_request') {
              const issue_number = context.payload.pull_request.number;
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: repoOwner,
                  repo: repoName,
                  issue_number,
                });

                const existingComment = comments.find(c => c.body && c.body.includes(commentTag));

                if (existingComment) {
                  await github.rest.issues.updateComment({
                    owner: repoOwner,
                    repo: repoName,
                    comment_id: existingComment.id,
                    body,
                  });
                  core.info(`Updated existing package comment on PR #${issue_number}`);
                } else {
                  await github.rest.issues.createComment({
                    owner: repoOwner,
                    repo: repoName,
                    issue_number,
                    body,
                  });
                  core.info(`Created new package comment on PR #${issue_number}`);
                }
              } catch (error) {
                core.warning(`Could not post/update PR comment (likely a fork without write permissions): ${error.message}`);
              }
            }

  e2e:
    name: Headless E2E
    runs-on: ubuntu-latest
    # The harness starts a real nested headless GNOME Shell and drives a full window
    # lifecycle. It is the test that catches "the extension fails to load" and the lifecycle
    # races (missing export, an unanswered D-Bus pick), so it is worth running here. Kept
    # non-blocking until the runner is known to be stable for it.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gnome-shell gjs dbus dbus-x11 python3 gettext ripgrep procps libgl1-mesa-dri

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Report the shell under test
        run: gnome-shell --version

      - name: Compile locales
        run: pnpm run compile-locales

      - name: Extend the deployed metadata to the runner's shell (test-only)
        # The shipped metadata.json lists the versions the extension is released to (50-51).
        # The runner carries an older shell; extending the metadata in this throwaway checkout
        # lets it load the extension, so the 45-49 compatibility branches are exercised
        # end-to-end on a real shell instead of only by unit tests. The shipped file is untouched.
        run: |
          major="$(gnome-shell --version | grep -oE '[0-9]+' | head -1)"
          python3 - src/metadata.json "$major" <<'PY'
          import json, sys
          path, major = sys.argv[1], sys.argv[2]
          data = json.load(open(path))
          data["shell-version"] = sorted(set(data["shell-version"] + [major]), key=int)
          json.dump(data, open(path, "w"), indent=4)
          print("shell-version ->", data["shell-version"])
          PY

      - name: Run headless E2E
        run: pnpm run test:e2e

      - name: Upload the nested shell log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shell-log
          path: /tmp/window-nativizer-dev/shell.log
          if-no-files-found: ignore
