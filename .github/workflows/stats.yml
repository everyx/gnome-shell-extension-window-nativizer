name: PR Code Stats

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  stats:
    name: Code size delta
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    steps:
      - name: Check out base
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compute base and head stats
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node head/tools/stats.mjs --root base --json > base-stats.json
          node head/tools/stats.mjs --root head --json > head-stats.json
          node head/tools/stats-diff.mjs base-stats.json head-stats.json \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" > comment.md

      - name: Add stats to the job summary
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- window-nativizer-code-stats -->';
            const body = fs.readFileSync('comment.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            try {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {owner, repo, issue_number, per_page: 100},
              );
              const existing = comments.find(c => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
                core.info(`Updated stats comment on PR #${issue_number}`);
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body,
                });
                core.info(`Created stats comment on PR #${issue_number}`);
              }
            } catch (error) {
              core.warning(
                `Could not post/update the stats comment: ${error.message}`);
            }
