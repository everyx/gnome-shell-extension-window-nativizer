name: Lint PR Title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            ci
            chore
            build
            style
          requireScope: false
          subjectPattern: ^[a-z\u4e00-\u9fa5].+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter or Chinese character.
            Example: "feat: 支持窗口阴影平滑过渡" or "fix: fix memory leak on window destroy"
